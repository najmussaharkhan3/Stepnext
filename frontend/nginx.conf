server {
    listen 80;
    server_name stepnextedge.com www.stepnextedge.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name stepnextedge.com www.stepnextedge.com;

    ssl_certificate /etc/letsencrypt/live/stepnextedge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stepnextedge.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
   
    location /storage {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
